<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMA笔记</title>
  <link rel="stylesheet" href="../styles/sidebar.css">
</head>
<body>
  <div class="sidebar-container">
    <div class="top-bar">
      <div class="button-group">
        <button id="select-btn" class="btn active"><img src="../assets/svg/选取.svg" class="btn-icon">选 取</button>
        <button id="full-text-btn" class="btn"><img src="../assets/svg/全文.svg" class="btn-icon">全 文</button>
      </div>
      <button id="menu-btn" class="menu-btn">☰</button>
    </div>
    <div class="top-divider"></div>
    <div id="menu-dropdown" class="menu-dropdown">
      <div class="menu-item" id="config-ima">配置 IMA API</div>
      <div class="menu-item" id="refresh-kb">刷新知识库</div>
      <div class="menu-item" id="settings">设置</div>
      <div class="menu-item" id="about-author">关于作者</div>
    </div>
    
    <!-- API 配置模态框 -->
    <div id="api-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>配置 IMA API</h3>
          <button id="close-modal" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="api-key-input">API Key</label>
            <input type="password" id="api-key-input" class="api-input" placeholder="请输入 API Key">
          </div>
          <div class="form-group">
            <label for="client-id-input">Client ID</label>
            <input type="text" id="client-id-input" class="api-input" placeholder="请输入 Client ID">
          </div>
          <p class="api-hint">
            获取方式：打开 <a href="https://ima.qq.com/agent-interface" target="_blank">ima.qq.com/agent-interface</a> 
            获取 Client ID 和 API Key
          </p>
        </div>
        <div class="modal-footer">
          <button id="quick-config-btn" class="btn-secondary">一键配置</button>
          <div class="modal-footer-right">
            <button id="cancel-api" class="btn-secondary">取消</button>
            <button id="save-api" class="btn-primary">保存</button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="content-area-container">
      <textarea id="md-source" class="md-source" contenteditable="true"></textarea>
      <div id="content-preview" class="content-preview" style="display: none;"></div>
      <div class="content-toolbar">
        <button id="toggle-md-btn" class="toggle-md-btn" title="Markdown 预览">
          <svg class="code-icon" viewBox="0 0 1024 1024">
            <path d="M246.72 327.296c-12.032-12.032-31.424-12.032-43.456 0L9.024 521.344c-12.032 11.968-12.032 31.36 0 43.392l194.304 194.048c12.032 11.968 31.424 11.968 43.456 0 12.032-12.032 12.032-31.36 0-43.392L74.112 543.04l172.608-172.416C258.752 358.656 258.752 339.264 246.72 327.296zM954.368 521.344l-194.304-194.048c-12.032-12.032-31.488-12.032-43.456 0-12.032 11.968-12.032 31.36 0 43.328l172.608 172.416-172.608 172.352c-12.032 12.032-12.032 31.36 0 43.392 11.968 11.968 31.424 11.968 43.456 0l194.304-194.048C966.4 552.768 966.4 533.312 954.368 521.344zM689.664 132.608c-15.296-8.96-34.88-3.648-43.712 11.84l-384 766.848c-8.896 15.424-3.648 35.2 11.712 44.032 15.296 8.96 34.88 3.648 43.776-11.84l383.936-766.848C710.272 161.28 705.024 141.504 689.664 132.608z"/>
          </svg>
        </button>
        <div id="unlock-popup" class="unlock-popup" style="display: none;">
          <span id="mode-hint" class="mode-hint"></span>
        </div>
        <button id="clear-content-btn" class="clear-content-btn">清空</button>
      </div>
    </div>
    
    <div class="bottom-buttons">
      <div class="kb-selector-wrapper">
        <select id="kb-selector" class="kb-selector">
          <option value="">请先配置 IMA API</option>
        </select>
      </div>
      <button id="save-btn" class="save-btn">保 存</button>
    </div>
    
    <!-- 作者信息模态框 -->
    <div id="author-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>关于作者</h3>
          <button id="close-author-modal" class="close-btn">&times;</button>
        </div>
        <div class="modal-body author-modal-body">
          <div class="author-avatar-container">
            <img src="../assets/images/author.jpg" class="author-avatar" alt="作者头像">
          </div>
          <div class="author-info">
            <h4 class="author-name">white</h4>
            <div class="author-github">
              插件开源地址<a href="https://github.com/RougeWhite/flomo-cut" target="_blank">https://github.com/RougeWhite/flomo-cut</a>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="close-author-btn" class="btn-primary">关闭</button>
        </div>
      </div>
    </div>
    
    <!-- 自定义提示组件 -->
    <div id="custom-alert" class="custom-alert" style="display: none;">
    </div>
    
    <!-- 一键配置弹窗 -->
    <div id="quick-config-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>一键配置</h3>
          <button id="close-quick-config" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <p class="quick-config-hint">粘贴从 IMA 平台复制的凭证信息：</p>
          <textarea id="credential-input" class="credential-input" placeholder="API Key: xxx
Client ID: xxx"></textarea>
          <p class="quick-config-hint-bottom">格式示例：<br>API Key: 3rQPzaVTwpHOHLQc1lv/T2Z3...<br>Client ID: cf4b0a2132145c41aad41a6617d423eb</p>
        </div>
        <div class="modal-footer">
          <button id="get-credential-btn" class="btn-secondary">获取凭证</button>
          <button id="apply-quick-config" class="btn-primary">应用</button>
        </div>
      </div>
    </div>
  </div>
  <script src="../scripts/libs/marked.min.js"></script>
  <script src="../scripts/sidebar.js"></script>
</body>
</html>
